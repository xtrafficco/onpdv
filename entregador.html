<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#12307a">
<!-- Content-Security-Policy (mesma política do index.html, adaptada ao app do entregador). -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  base-uri 'self';
  object-src 'none';
  script-src 'self' https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data: blob: https://qkhpvqepgozsaamxmugk.supabase.co;
  media-src 'self' blob:;
  connect-src 'self' https://qkhpvqepgozsaamxmugk.supabase.co wss://qkhpvqepgozsaamxmugk.supabase.co;
  frame-src 'none';
  worker-src 'self';
  manifest-src 'self';
  form-action 'self';">
<title>ONPDV Entregas — App do entregador</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ONPDV Entregas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<!-- supabase-js: versão EXATA + SRI (integrity), igual ao index.html -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8"
        integrity="sha384-Tve8O+C6PBzsIMK/IRCwHbi8fyEzXIlIs6OfVBZHubplwYhaQF/4Mzxqgg+pp/oy"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root{
  --dark:#12307a; --dark2:#0e2660; --bg:#f7f8fa; --card:#fff;
  --ink:#1c2333; --ink2:#7a869f; --line:#e4e7ee;
  --accent:#ffcf3f; --accent-d:#e9b400; --green:#1f9d55; --green-soft:#e3f6ec;
  --red:#d94b45; --amber:#e2a400; --focus:#5e6ad2; --r:12px; --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.06);
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
h1,h2,h3,h4{font-family:'Fredoka',sans-serif;font-weight:600;letter-spacing:-.2px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;font-size:16px}
.hide{display:none!important}
.muted{color:var(--ink2)}

/* ---------- botões / chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--dark);color:#fff;border-radius:11px;padding:12px 16px;font-weight:800;font-size:15px;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn.acc{background:var(--accent);color:var(--dark2)}
.btn.green{background:var(--green)}
.btn.ghost{background:#f4f7ff;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:900;background:var(--dark);color:#fff}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.amber{background:#fff2cc;color:#8a6b00}
.chip.warn{background:#fdeceb;color:var(--red)}

/* ---------- login ---------- */
#login{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(160deg,#12307a,#0a1c4d);padding:20px;z-index:50}
#login .box{background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.35);width:min(400px,100%);padding:26px}
.brand{font-family:'Fredoka';font-weight:700;font-size:26px;color:var(--dark);display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:4px}
.brand .on{background:var(--accent);color:var(--dark2);border-radius:8px;padding:1px 8px}
.sub{text-align:center;color:var(--ink2);font-size:13px;margin-bottom:18px}
.lbl{display:block;font-size:12px;font-weight:800;color:var(--ink2);margin:0 0 5px 2px;text-transform:uppercase;letter-spacing:.3px}
.in{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;color:var(--ink);outline:none;transition:border .15s;margin-bottom:12px}
.in:focus{border-color:var(--focus);box-shadow:0 0 0 3px rgba(94,106,210,.15)}
#liMsg{min-height:18px;font-size:13px;color:var(--red);text-align:center;margin-top:6px}

/* ---------- topo ---------- */
.top{background:var(--dark);color:#fff;position:sticky;top:0;z-index:20;padding:calc(12px + var(--safe-t)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.top .brand-sm{font-family:'Fredoka';font-weight:700;font-size:19px;display:flex;align-items:center;gap:7px}
.top .loja{font-size:12px;opacity:.85}
.body{max-width:760px;margin:0 auto;padding:14px 16px calc(28px + var(--safe-b))}
.hello{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.hello h2{font-size:22px}
.refresh{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-weight:800;color:var(--ink)}

.scanbtn{width:100%;background:var(--accent);color:var(--dark2);border-radius:16px;padding:20px;font-size:18px;font-weight:900;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:10px}
.scanbtn:active{transform:translateY(1px)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin-top:12px}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:15px;padding:11px 0;color:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin:16px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);font-weight:800}
.stat .v{font-family:'Fredoka';font-size:21px;font-weight:600;color:var(--dark)}

.sec{font-family:'Fredoka';font-size:18px;margin:20px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.empty{color:var(--ink2);padding:2px 0 6px}

/* ---------- cartões (cores corrigidas: texto escuro em fundo claro) ---------- */
.card{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:11px;box-shadow:0 2px 10px rgba(18,48,122,.06)}
.card.rota{border-color:var(--accent-d);border-left:5px solid var(--accent-d)}
.card.done{opacity:.8}
.card .nm{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900;font-size:15.5px;color:var(--ink)}
.card .adr{margin:7px 0;font-size:15px;color:var(--ink)}
.card .mt{color:var(--ink2);font-size:13px}
.card .mt b{color:var(--dark)}
.acts{margin-top:11px;display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{text-decoration:none}

.exit{width:100%;margin:24px 0 8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;font-weight:800;color:var(--ink)}

/* ---------- install banner ---------- */
#install{position:sticky;bottom:0;z-index:15;margin:14px 16px calc(10px + var(--safe-b));max-width:760px;background:var(--dark);color:#fff;border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
#install .txt{flex:1;font-size:13.5px;font-weight:700;line-height:1.3}
#install .txt small{display:block;font-weight:600;opacity:.8;font-size:11.5px}
#install button{white-space:nowrap}

/* ---------- scanner ---------- */
#scan{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b))}
#scan.on{display:flex}
#scanVideo{width:100%;max-width:520px;border-radius:16px;background:#111;aspect-ratio:3/4;object-fit:cover}
#scanMsg{color:#fff;text-align:center;font-weight:700}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(9,18,45,.55);display:grid;place-items:end center;z-index:70;padding:0}
.modal{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;overscroll-behavior:contain;padding-bottom:calc(12px + var(--safe-b))}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 18px 8px;position:sticky;top:0;background:#fff}
.m-head h3{font-size:19px}
.m-head button{font-size:16px;font-weight:900;color:var(--ink2);width:34px;height:34px;border-radius:50%;background:#f1f4fb}
.m-body{padding:6px 18px 16px}
.m-body p{margin:3px 0}
.tbl{width:100%;border-collapse:collapse;margin-top:8px}
.tbl th,.tbl td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
.tbl .r{text-align:right}
.sum{background:#f4f7ff;border-radius:12px;padding:10px 12px;margin-top:10px}
.sum .l{display:flex;justify-content:space-between;padding:3px 0}
.sum .l.big{font-family:'Fredoka';font-size:19px;font-weight:600;border-top:1px solid var(--line);margin-top:5px;padding-top:8px}
.m-foot{display:flex;gap:8px;padding:6px 18px 14px;flex-wrap:wrap}
.m-foot .btn{flex:1;min-width:130px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:#0e2660;color:#fff;padding:12px 18px;border-radius:12px;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <div class="brand">🛵 <span><span class="on">ON</span>PDV</span></div>
    <p class="sub">App do entregador</p>
    <label class="lbl" for="liEmail">E-mail</label>
    <input id="liEmail" class="in" type="email" autocomplete="username" inputmode="email" placeholder="voce@email.com">
    <label class="lbl" for="liPass">Senha</label>
    <input id="liPass" class="in" type="password" autocomplete="current-password" placeholder="sua senha">
    <button class="btn block" id="btnLogin">Entrar</button>
    <p id="liMsg"></p>
  </div>
</div>

<div id="app" class="hide">
  <div class="top">
    <div class="brand-sm">🛵 ONPDV Entregas</div>
    <span class="loja" id="loja"></span>
  </div>
  <div class="body">
    <div class="hello">
      <h2>Olá, <span id="name">—</span>!</h2>
      <button class="refresh" id="btnRefresh">↻ Atualizar</button>
    </div>
    <div id="geoStatus" style="margin:0 0 10px;font-size:12.5px;font-weight:800;padding:7px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;background:#eef2fb;color:#12307a">📍 localização desligada</div>
    <button class="scanbtn" id="btnScan">📷 Escanear etiqueta do pedido</button>
    <div class="search">
      <span class="muted">🔎</span>
      <input id="q" placeholder="…ou buscar pelo número do pedido" inputmode="numeric" autocomplete="off">
      <button class="btn ghost sm" id="btnFind">Buscar</button>
    </div>
    <div class="stats" id="stats"></div>
    <div id="list"></div>
    <button class="exit" id="btnLogout">Sair da conta</button>
  </div>
  <div id="install" class="hide">
    <div class="txt">📲 Instale o app na tela inicial<small id="installHint">Toque para instalar e abrir como um app.</small></div>
    <button class="btn acc sm" id="btnInstall">Instalar</button>
    <button class="btn ghost sm" id="btnInstallClose">✕</button>
  </div>
</div>

<div id="scan">
  <video id="scanVideo" autoplay playsinline muted></video>
  <p id="scanMsg">Aponte a câmera para o QR da guia…</p>
  <button class="btn ghost" data-act="stopScan">Cancelar</button>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script src="assets/js/entregador.js" defer></script>
</body>
</html>
